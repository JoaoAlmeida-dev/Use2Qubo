<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">USE2QUBO</title>
  <desc id="desc">Q lettermark: a white ring holding an upper-triangular QUBO matrix, with a UML composition diamond and association line as the tail.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13A89A"/>
      <stop offset="1" stop-color="#0B6E64"/>
    </linearGradient>
  </defs>

  <!-- Tile: poster teal, gradient along the tail's 45° axis. Set rx="0" for stores that apply their own mask. -->
  <rect width="1024" height="1024" rx="228" fill="url(#tile)"/>

  <!-- Counter: dark inset behind the matrix -->
  <circle cx="500" cy="500" r="346" fill="#08524B"/>

  <!-- QUBO matrix, 3x3 upper triangular, centred on the ring; main diagonal lies on the tail axis -->
  <!-- lower triangle: zeros -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4">
    <rect x="309.5" y="444.5" width="111" height="111" rx="14"/>
    <rect x="309.5" y="579.5" width="111" height="111" rx="14"/>
    <rect x="444.5" y="579.5" width="111" height="111" rx="14"/>
  </g>
  <!-- upper triangle: quadratic couplings -->
  <g fill="#FFFFFF">
    <rect x="442.5" y="307.5" width="115" height="115" rx="16"/>
    <rect x="577.5" y="307.5" width="115" height="115" rx="16" fill-opacity="0.55"/>
    <rect x="577.5" y="442.5" width="115" height="115" rx="16" fill-opacity="0.8"/>
  </g>
  <!-- diagonal: linear terms -->
  <g fill="#FF7A5C">
    <rect x="307.5" y="307.5" width="115" height="115" rx="16"/>
    <rect x="442.5" y="442.5" width="115" height="115" rx="16"/>
    <rect x="577.5" y="577.5" width="115" height="115" rx="16"/>
  </g>

  <!-- Q ring -->
  <circle cx="500" cy="500" r="346" fill="none" stroke="#FFFFFF" stroke-width="68"/>

  <!-- Q tail: UML association line + composition diamond, centred on the ring's outer edge at 45° -->
  <g transform="translate(763 763) rotate(45)">
    <line x1="80" y1="0" x2="150" y2="0" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
    <path d="M-80 0 L0 -46 L80 0 L0 46 Z" fill="#FF7A5C" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>
  </g>
</svg>
